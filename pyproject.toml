[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tft-decision-agent"
version = "0.1.0"
description = "A maintainable foundation for a version-aware TFT decision agent."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mcp[cli]>=2,<3",
  "openai>=1.99,<3",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.2,<3",
  "cryptography>=50,<51",
  "pillow>=11,<13",
  "sentence-transformers>=5,<6",
  "mss>=10,<11",
  "PySide6>=6.8,<7",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10,<2",
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.5,<1",
]

[project.scripts]
tft-agent = "tft_agent.app.main:main"
tft-agent-desktop = "tft_agent.desktop.main:main"
tft-eval-guide-understanding = "tft_agent.evals.guide_understanding_runner:main"
tft-sync-datatft = "tft_agent.ingestion.sync_datatft:main"
tft-sync-static-data = "tft_agent.ingestion.sync_static_data:main"
tft-mcp-server = "tft_agent.tft_mcp_server.server:main"
tft-sync-game-data = "tft_agent.ingestion.sync_game_data:main"
tft-sync-shop-odds = "tft_agent.ingestion.sync_shop_odds:main"
tft-ingest-knowledge = "tft_agent.ingestion.ingest_knowledge:main"
tft-eval-retrieval-v03 = "tft_agent.evals.retrieval_v03_runner:main"
tft-eval-strategy-v031 = "tft_agent.evals.strategy_decision_v031_runner:main"
tft-eval-board-v04 = "tft_agent.evals.board_decision_v04_runner:main"
tft-vision-extract = "tft_agent.app.vision_extract:main"
tft-eval-vision-v05 = "tft_agent.evals.vision_extraction_v05_runner:main"
tft-eval-vision-e2e-v05 = "tft_agent.evals.vision_e2e_v05_runner:main"
tft-smoke-rag-mcp = "tft_agent.evals.rag_mcp_smoke:main"
tft-eval-tool-selection = "tft_agent.evals.tool_selection_runner:main"
tft-eval-outcome-safety = "tft_agent.evals.outcome_safety_runner:main"
tft-eval-decision-v02 = "tft_agent.evals.decision_v02_runner:main"
tft-eval-grounded-decision = "tft_agent.evals.grounded_decision_runner:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tft_agent"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["real_llm: opt-in tests that call the configured external LLM provider"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".tools", ".uv-cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[dependency-groups]
dev = [
    "types-jsonschema>=4.26.0.20260518",
]
